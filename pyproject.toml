[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metis-reverse"
version = "1.0.0"
description = "Evidence-grounded Agentic Reverse Engineering MCP Server & Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Metis Reverse Authors" }
]
keywords = [
    "reverse-engineering",
    "mcp",
    "ghidra",
    "binary-analysis",
    "agentic-ai",
    "security"
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
metis-reverse = "metis_reverse.server:main"

[tool.setuptools.packages.find]
include = ["metis_reverse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

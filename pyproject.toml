[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metis-reverse"
version = "0.1.0"
description = "Metis Reverse: High-Fidelity AI-Assisted Deterministic Reverse Engineering MCP Server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Metis Reverse Team" }
]
keywords = [
    "reverse-engineering",
    "mcp",
    "fastmcp",
    "decompiler",
    "ghidra",
    "angr",
    "capstone",
    "lief",
    "binary-analysis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]

dependencies = [
    "fastmcp>=4.1.0",
    "mcp>=2.3.0",
    "lief>=1.0.0",
    "capstone>=5.0.7",
    "unicorn>=2.1.4",
    "angr>=10.0.4",
    "frida>=17.0.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-c>=0.24.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "pydantic>=2.10.0",
    "rich>=14.0.0",
]

[project.urls]
Homepage = "https://github.com/Wholiver/metis-reverse"
Repository = "https://github.com/Wholiver/metis-reverse"
Issues = "https://github.com/Wholiver/metis-reverse/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
metis-reverse = "metis_reverse.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/metis_reverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/unit/", "build/"]
